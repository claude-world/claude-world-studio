name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      - name: CLI smoke test
        run: node bin/cli.js help > /dev/null

      - name: Fresh-boot smoke test
        run: |
          export STUDIO_USER_DATA_PATH="$RUNNER_TEMP/studio-fresh"
          npx tsx server/server.ts &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3001/api/settings > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3001/api/settings > /dev/null
          curl -sf http://127.0.0.1:3001/ | grep -q "Claude World Studio"
          test -f "$STUDIO_USER_DATA_PATH/studio.db"
          kill $SERVER_PID

      - name: Package validation
        run: npm pack --dry-run 2>&1 | tail -20

      - name: Run tests
        run: npm run test

      - name: Security audit
        run: npm audit --audit-level=critical
