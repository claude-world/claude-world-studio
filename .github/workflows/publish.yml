name: Publish to npm

on:
  release:
    types: [published]
  # Re-publish the version currently on main without cutting a new release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never restore a cache into a release build

      # Trusted publishing needs npm >= 11.5.1; Node 24 bundles 11.19.1 today.
      # Verify the floor rather than installing npm@latest: a newer npm blocks
      # install scripts not listed in allowScripts, which silently leaves
      # better-sqlite3 without its native binary and fails `npm ci`.
      - name: Verify npm supports trusted publishing
        run: |
          have=$(npm --version)
          need=11.5.1
          echo "npm $have"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have is too old for OIDC trusted publishing (need >= $need)" >&2
            exit 1
          fi

      - run: npm ci

      # No NODE_AUTH_TOKEN: the OIDC token minted by id-token: write is the credential.
      # prepublishOnly builds the client before the tarball is assembled.
      - run: npm publish --access public --provenance
